name: fritchii-thor-aarch64

# Builds Fritchii v6.5 + Duo/Thor patches into Fritchii-Thor-aarch64.AppImage.
# Needs GitHub-hosted ubuntu-24.04-arm (mirror this repo to GitHub, or copy the
# workflow into a Frizti/Fritchii fork that vendors packaging/thor + patches/duo).

on:
  workflow_dispatch:
    inputs:
      fritchii_ref:
        description: Fritchii git ref (tag or SHA)
        type: string
        default: fritchii-v6.5
      publish_release:
        description: Publish a GitHub release with the AppImage
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fritchii-thor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: linux-aarch64 Thor AppImage
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
      CCACHE_COMPILERCHECK: content
      FRITCHII_REF: ${{ inputs.fritchii_ref || 'fritchii-v6.5' }}
    steps:
      - name: Check out memvault (patches + packaging)
        uses: actions/checkout@v5
        with:
          path: memvault

      - name: Check out Fritchii
        uses: actions/checkout@v5
        with:
          repository: Frizti/Fritchii
          ref: ${{ env.FRITCHII_REF }}
          path: Fritchii
          submodules: recursive

      - name: Apply Duo + Thor patches
        shell: bash
        run: |
          set -euo pipefail
          chmod +x memvault/patches/duo/scripts/apply.sh
          memvault/patches/duo/scripts/apply.sh "$GITHUB_WORKSPACE/Fritchii"
          # Guard: thor-qt must not reintroduce Qt6-deleted QChar(char).
          if grep -RIn --include='*.cpp' "QChar('/')" Fritchii/src/yuzu/duo >/dev/null 2>&1; then
            echo "::error::Duo Qt still uses QChar('/') after apply — tree/ must win over thor-qt"
            exit 1
          fi

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf cmake g++ gcc git glslang-tools libglu1-mesa-dev \
            libpulse-dev libtool libudev-dev libxkbcommon-x11-0 \
            mesa-common-dev nasm ninja-build qt6-base-private-dev \
            qt6-charts-dev qt6-tools-dev libavfilter-dev libavcodec-dev \
            libswscale-dev pkg-config zlib1g-dev libva-dev libvdpau-dev \
            spirv-tools spirv-headers libusb-1.0-0-dev \
            libboost-dev libboost-fiber-dev libboost-context-dev \
            libopus-dev libasound2-dev ccache \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install Qt on Linux ARM64
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux_arm64
          target: desktop
          arch: linux_gcc_arm64
          modules: qtcharts
          cache: true

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-thor-aarch64-${{ github.sha }}
          restore-keys: |
            ccache-thor-aarch64-

      - name: Configure Thor build
        working-directory: Fritchii
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$GITHUB_WORKSPACE/memvault/packaging/thor/scripts/configure-thor.sh"
          BUILD_TAG="thor-${GITHUB_RUN_NUMBER}" \
          BUILD_PLATFORM=linux-aarch64 \
            "$GITHUB_WORKSPACE/memvault/packaging/thor/scripts/configure-thor.sh"

      - name: Build
        working-directory: Fritchii
        shell: bash
        run: |
          set -euo pipefail
          # -k 0 keeps going so one TU doesn't hide siblings; still fails the step.
          cmake --build build/release --parallel "$(nproc)" -- -k 0
          ccache -s || true
          test -x build/release/bin/lichii

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-thor-aarch64-${{ github.sha }}-${{ github.run_id }}

      - name: Package AppImage
        working-directory: Fritchii
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$GITHUB_WORKSPACE/memvault/packaging/thor/scripts/package-appimage.sh"
          LDAI_VERSION="thor-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" \
          OUT_NAME="Fritchii-Thor-aarch64.AppImage" \
          OUT_DIR="$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/memvault/packaging/thor/scripts/package-appimage.sh" \
            "$GITHUB_WORKSPACE/Fritchii" "$GITHUB_WORKSPACE/memvault"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fritchii-Thor-aarch64
          path: Fritchii-Thor-aarch64.AppImage
          if-no-files-found: error

      - name: Publish release
        if: inputs.publish_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="thor-${GITHUB_RUN_NUMBER}"
          notes="Fritchii \`${FRITCHII_REF}\` + Duo/Thor patches (clock-max, Eden Duo companions) for AYN Thor / ArmadaOS. Download Fritchii-Thor-aarch64.AppImage, chmod +x, and replace your existing Thor AppImage path."
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Fritchii Thor $tag" \
            --notes "$notes" \
            Fritchii-Thor-aarch64.AppImage
