# ZA Recomp defaults for AYN Thor / Armada OS (Adreno + Mesa Turnip).
# Copied next to lasrecomp by prepare-gamebuild / fix-graphics-armada.sh as za-default.ini
# on first run (when no larecomp.ini exists yet). Safer than the desktop FSR1 / 1.5x / 60 preset.
aspect = unlocked
fullscreen = 1
volume = 1.00
reverb = 1
movie_audio = 1
show_fps = 1
fps60 = 0
fps60_lock = 0
aniso16 = 0
dynamic_res = off
tex_hd = 0
upscaler = bilinear
antialias = off
resolution = 1x
operation_mode = handheld
video_recommended = auto
inv_keys = 1
dpad_move = 0
move_360 = 0
blur_removal = 0
prompts = auto
language = auto
gpu_xfb_mirror = off
gpu_dynamic_vertex = auto
gpu_overlap = auto
gpu_straight_shaders = auto
bind_pad_a = south
bind_pad_b = east
bind_pad_x = west
bind_pad_y = north
bind_key_a = Return
bind_key_b = Backspace
bind_key_plus = P
bind_key_minus = M
